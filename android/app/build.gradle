plugins {
    id 'com.android.application'
}

def vCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
def vName = System.getenv("VERSION_NAME") ?: "1.0"

android {
    namespace 'io.github.khalm.lurt'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.khalm.lurt'
        minSdk 26
        targetSdk 35
        versionCode vCode
        versionName vName
    }

    signingConfigs {
        release {
            storeFile rootProject.file('lurt.keystore')
            storePassword 'lurtlurt'
            keyAlias 'lurt'
            keyPassword 'lurtlurt'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
