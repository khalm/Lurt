# Bygger Android-appen (APK) og legger den ut som nedlasting:
# https://github.com/khalm/Lurt/releases/download/android/Lurt.apk
# Appen viser nettsiden, så den trenger bare bygges på nytt når noe i android/ endres.
name: Bygg Android-app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Bygg APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          export VERSION_NAME=$(grep -oP "APP_VERSION = '\K[^']+" app.js || echo 1.0)
          echo "Versjon $VERSION_NAME ($VERSION_CODE)"
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp android/app/build/outputs/apk/release/app-release.apk Lurt.apk
          ls -la Lurt.apk

      - name: Legg ut for nedlasting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android \
            --title "Lurt? – Android-app" \
            --notes "Last ned **Lurt.apk** på telefonen og åpne filen for å installere. Appen oppdaterer seg selv når nettsiden oppdateres." \
            --latest
          gh release upload android Lurt.apk --clobber
          echo "✅ APK lagt ut: https://github.com/${{ github.repository }}/releases/download/android/Lurt.apk" >> $GITHUB_STEP_SUMMARY

      - name: Rapporter feil
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; (grep -E "error|Error|FAILED|What went wrong" -A3 build.log 2>/dev/null | head -80) || true; echo; tail -40 build.log 2>/dev/null || true; echo '```'; } > err.md
          gh issue create --title "Android-bygg feilet (kjøring ${{ github.run_number }})" --body-file err.md --label bug 2>/dev/null \
            || gh issue create --title "Android-bygg feilet (kjøring ${{ github.run_number }})" --body-file err.md
