# Publiserer appen på GitHub Pages og bygger inn prisnøkkelen fra repoets Secrets.
# Krever: Settings → Pages → Source: «GitHub Actions».
name: Publiser appen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Bygg inn nøkkel/proxy fra Secrets
        env:
          KASSAL_KEY: ${{ secrets.KASSAL_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          node -e '
            const fs = require("fs");
            const key = (process.env.KASSAL_KEY || "").trim(), proxy = (process.env.PROXY_URL || "").trim();
            const c = { apiKey: proxy ? "" : key, proxy };
            fs.writeFileSync("config.js", "window.LURT_CONFIG = " + JSON.stringify(c) + ";\n");
            fs.writeFileSync("build-info.json", JSON.stringify({ priceData: !!(key || proxy), built: new Date().toISOString(), commit: process.env.GITHUB_SHA.slice(0, 7) }) + "\n");
            const ok = !!(key || proxy);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, ok ? "✅ Prisnøkkel bygget inn\n" : "⚠️ Fant ikke secret KASSAL_KEY – appen publiseres uten prisdata\n");
            console.log(ok ? "Prisnøkkel: OK" : "::warning::Fant ikke secret KASSAL_KEY");
          '
          rm -rf .github worker.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
